<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        
        /* Custom Scrollbar for list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        /* Smooth reveal animation for new items */
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter {
            animation: fadeInSlide 0.3s ease-out forwards;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #6366f1;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center py-12 px-4 sm:px-6">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 bg-red-500 text-white px-6 py-3 rounded-xl shadow-lg transform transition-transform duration-300 translate-y-[-150%] opacity-0 z-50 flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span id="toast-msg">Error message</span>
    </div>

    <!-- NEW: Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold"><i class="fas fa-sliders-h mr-2"></i> Alarm Settings</h2>
                <button id="close-settings" class="text-indigo-200 hover:text-white transition-colors"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Custom Alarm Sound</label>
                    <input type="file" id="audio-upload" accept="audio/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all cursor-pointer border border-slate-200 rounded-xl p-1">
                    <p class="text-xs text-slate-400 mt-2">Max 2.5MB. Saved locally to this browser.</p>
                    <div class="mt-3 flex gap-2">
                        <button id="test-sound" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition-colors w-28"><i class="fas fa-play mr-1 text-indigo-500"></i> Test</button>
                        <button id="clear-sound" class="text-sm bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-medium transition-colors hidden"><i class="fas fa-trash-alt mr-1"></i> Remove</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Sound Play Duration</label>
                    <select id="sound-duration" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer">
                        <option value="2">2 Seconds</option>
                        <option value="3">3 Seconds</option>
                        <option value="5">5 Seconds</option>
                        <option value="10">10 Seconds</option>
                        <option value="full">Full Song / Continuous</option>
                    </select>
                </div>
            </div>
            <div class="bg-slate-50 p-4 border-t border-slate-100 flex justify-end">
                <button id="save-settings" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-medium transition-colors shadow-sm">Save Preferences</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-2xl bg-white shadow-xl shadow-slate-200/60 rounded-3xl overflow-hidden flex flex-col border border-slate-100">
        
        <!-- Header & Input Area -->
        <div class="bg-indigo-600 p-8 sm:p-10 text-white relative overflow-hidden">
            <!-- Decorative circles -->
            <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-indigo-500 rounded-full opacity-50 blur-2xl"></div>
            <div class="absolute bottom-[-30px] left-[-20px] w-24 h-24 bg-indigo-400 rounded-full opacity-30 blur-xl"></div>
            
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-3xl font-bold tracking-tight mb-1">My Tasks</h1>
                        <p class="text-indigo-200 text-sm font-medium" id="date-display">Loading date...</p>
                    </div>
                    <div class="flex gap-2 items-center">
                        <button id="settings-btn" class="bg-indigo-700/50 text-indigo-200 hover:text-white px-3 py-1.5 rounded-full transition-colors shadow-sm" title="Alarm Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>

                <div class="relative flex items-center mb-4">
                    <div class="absolute left-4 text-indigo-300">
                        <i class="fas fa-plus"></i>
                    </div>
                    <input type="text" id="todo-input" placeholder="What needs to be done?" 
                        class="w-full bg-white/10 border border-white/20 text-white placeholder-indigo-200 rounded-xl py-4 pl-12 pr-16 focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/20 transition-all text-lg shadow-inner">
                    <button id="add-btn" class="absolute right-2 bg-white text-indigo-600 hover:bg-indigo-50 p-2 w-10 h-10 rounded-lg shadow-sm transition-colors flex items-center justify-center">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>

                <!-- NEW: Task Scheduling & Category Options -->
                <div class="flex flex-wrap items-center gap-3 bg-indigo-800/40 p-2.5 rounded-xl backdrop-blur-sm border border-indigo-400/20">
                    <select id="todo-category" class="bg-transparent text-indigo-50 border-none text-sm focus:ring-0 cursor-pointer outline-none font-medium appearance-none">
                        <option value="General" class="bg-indigo-800 text-white">🗂️ General</option>
                        <option value="Work" class="bg-indigo-800 text-white">💼 Work</option>
                        <option value="Personal" class="bg-indigo-800 text-white">🏠 Personal</option>
                        <option value="Health" class="bg-indigo-800 text-white">💪 Health/Gym</option>
                    </select>

                    <div class="w-px h-5 bg-indigo-400/30 my-auto"></div>

                    <div class="flex items-center text-sm font-medium">
                        <i class="far fa-clock text-indigo-300 mr-2"></i>
                        <input type="time" id="todo-time" class="bg-transparent text-indigo-50 border-none focus:ring-0 outline-none cursor-pointer [color-scheme:dark]">
                    </div>

                    <div class="w-px h-5 bg-indigo-400/30 my-auto"></div>

                    <div class="flex items-center text-sm font-medium">
                        <i class="far fa-bell text-indigo-300 mr-2"></i>
                        <select id="todo-reminder" class="bg-transparent text-indigo-50 border-none focus:ring-0 cursor-pointer outline-none appearance-none">
                            <option value="-1" class="bg-indigo-800 text-white">No reminder</option>
                            <option value="0" class="bg-indigo-800 text-white" selected>At exact time</option>
                            <option value="3" class="bg-indigo-800 text-white">3 min before</option>
                            <option value="5" class="bg-indigo-800 text-white">5 min before</option>
                            <option value="10" class="bg-indigo-800 text-white">10 min before</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task List Area -->
        <div class="p-6 sm:p-8 bg-slate-50 flex-1 flex flex-col">
            
            <!-- NEW: Category Filter Bar -->
            <div class="flex space-x-2 mb-4 overflow-x-auto custom-scrollbar pb-2">
                <button class="cat-filter-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 transition-all shadow-sm" data-cat="All">All Categories</button>
                <button class="cat-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-500 hover:bg-slate-100 transition-all border border-slate-200" data-cat="Work">Work</button>
                <button class="cat-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-500 hover:bg-slate-100 transition-all border border-slate-200" data-cat="Personal">Personal</button>
                <button class="cat-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-500 hover:bg-slate-100 transition-all border border-slate-200" data-cat="Health">Health</button>
                <button class="cat-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-500 hover:bg-slate-100 transition-all border border-slate-200" data-cat="General">General</button>
            </div>

            <ul id="todo-list" class="space-y-3 max-h-[45vh] overflow-y-auto custom-scrollbar pr-2 pb-4">
                <!-- Loading State -->
                <li class="text-center text-slate-400 py-10 flex flex-col items-center">
                    <div class="loading-spinner border-slate-300 border-top-indigo-500 mb-4"></div>
                    <p>Loading your tasks...</p>
                </li>
            </ul>
        </div>

        <!-- Footer / Filters -->
        <div class="bg-white border-t border-slate-100 p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-slate-500">
            <span id="items-left" class="font-medium bg-slate-100 px-3 py-1 rounded-full text-slate-600">0 items left</span>
            
            <div class="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                <button class="filter-btn active px-4 py-1.5 rounded-lg text-indigo-600 bg-white shadow-sm font-medium transition-all" data-filter="all">All</button>
                <button class="filter-btn px-4 py-1.5 rounded-lg hover:text-slate-800 transition-all" data-filter="active">Active</button>
                <button class="filter-btn px-4 py-1.5 rounded-lg hover:text-slate-800 transition-all" data-filter="completed">Completed</button>
            </div>

            <button id="clear-completed" class="hover:text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-2">
                <i class="fas fa-trash-alt text-xs"></i> Clear completed
            </button>
        </div>
    </div>

    <!-- NEW: SanStudio Footer Credit -->
    <div class="mt-8 transform transition-all hover:-translate-y-1 hover:scale-105 duration-300 animate-enter" style="animation-delay: 0.3s;">
        <a href="https://sanstudio-hub.github.io/in/" target="_blank" rel="noopener noreferrer" 
           class="group relative inline-flex items-center justify-center gap-2.5 px-6 py-2.5 bg-white/80 backdrop-blur-md border border-white/80 rounded-full shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_25px_-5px_rgba(99,102,241,0.3)] transition-all duration-500 overflow-hidden">
            
            <!-- Animated gradient background on hover -->
            <div class="absolute inset-0 bg-gradient-to-r from-indigo-50 via-purple-50 to-pink-50 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            
            <span class="text-slate-500 text-sm font-medium z-10 transition-colors group-hover:text-slate-700">Developed By</span>
            
            <!-- Cool glowing text -->
            <span class="relative z-10 font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 group-hover:from-indigo-500 group-hover:to-pink-500 transition-all duration-300 tracking-wide">
                SanStudio
            </span>
            
            <!-- Animated Icons -->
            <div class="relative z-10 flex items-center justify-center w-5 h-5 overflow-visible">
                <i class="fas fa-code text-indigo-400 text-sm absolute transition-all duration-300 group-hover:opacity-0 group-hover:scale-50 group-hover:rotate-90"></i>
                <i class="fas fa-rocket text-pink-500 text-sm absolute opacity-0 scale-50 translate-y-4 -translate-x-4 transition-all duration-500 group-hover:opacity-100 group-hover:scale-100 group-hover:translate-y-0 group-hover:translate-x-0"></i>
            </div>
        </a>
    </div>

    <!-- Local Browser Storage Logic -->
    <script>
        // Global State
        let todos = [];
        let currentFilter = 'all';
        let currentCategory = 'All';
        let userSettings = { duration: '5' };

        // UI Elements
        const todoInput = document.getElementById('todo-input');
        const todoCategory = document.getElementById('todo-category');
        const todoTime = document.getElementById('todo-time');
        const todoReminder = document.getElementById('todo-reminder');
        const catFilterBtns = document.querySelectorAll('.cat-filter-btn');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const itemsLeft = document.getElementById('items-left');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const clearCompletedBtn = document.getElementById('clear-completed');
        const dateDisplay = document.getElementById('date-display');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        
        // Settings UI Elements
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        const audioUpload = document.getElementById('audio-upload');
        const soundDuration = document.getElementById('sound-duration');
        const testSoundBtn = document.getElementById('test-sound');
        const clearSoundBtn = document.getElementById('clear-sound');
        const saveSettingsBtn = document.getElementById('save-settings');

        // Set Current Date
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        dateDisplay.textContent = new Date().toLocaleDateString('en-US', options);

        function showToast(message) {
            toastMsg.textContent = message;
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateY(-150%)';
                toast.style.opacity = '0';
            }, 4000);
        }

        // --- Core Functions (Local Storage) ---

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function saveTodos() {
            localStorage.setItem('premium_todos', JSON.stringify(todos));
        }

        function loadTodos() {
            const saved = localStorage.getItem('premium_todos');
            if (saved) {
                try {
                    todos = JSON.parse(saved);
                } catch(e) {
                    todos = [];
                }
            }
            renderTodos();
            
            // Load Settings
            const savedSettings = localStorage.getItem('premium_settings');
            if (savedSettings) {
                try {
                    userSettings = JSON.parse(savedSettings);
                    soundDuration.value = userSettings.duration || '5';
                } catch(e) {}
            }
        }

        function saveSettings() {
            userSettings.duration = soundDuration.value;
            localStorage.setItem('premium_settings', JSON.stringify(userSettings));
            showToast("Preferences saved!");
            toggleModal(false);
        }

        // XSS Prevention
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function handleAddTodo() {
            const text = todoInput.value.trim();
            if (!text) return;
            
            const category = todoCategory.value;
            const time = todoTime.value;
            const reminder = parseInt(todoReminder.value, 10);

            todoInput.value = ''; 
            todoInput.focus();
            
            // Ask for Notification Permissions when they add a task
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }

            const newTodo = {
                id: generateId(),
                text: text,
                category: category,
                time: time,
                reminder: reminder,
                notified: false,
                completed: false,
                createdAt: Date.now()
            };

            todos.unshift(newTodo); // Add to top
            saveTodos();
            renderTodos();
        }

        window.toggleTodoStatus = (id, currentStatus) => {
            const index = todos.findIndex(t => t.id === id);
            if (index !== -1) {
                todos[index].completed = !currentStatus;
                saveTodos();
                renderTodos();
            }
        };

        window.deleteTodoItem = (id) => {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            renderTodos();
        };

        function handleClearCompleted() {
            todos = todos.filter(t => !t.completed);
            saveTodos();
            renderTodos();
        }

        // --- UI Rendering ---

        function renderTodos() {
            todoList.innerHTML = '';

            let filteredTodos = todos;

            // Apply Category Filter
            if (currentCategory !== 'All') {
                filteredTodos = filteredTodos.filter(t => t.category === currentCategory);
            }

            // Apply Status Filter
            if (currentFilter === 'active') {
                filteredTodos = filteredTodos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = filteredTodos.filter(t => t.completed);
            }

            if (todos.length === 0) {
                todoList.innerHTML = `
                    <li class="text-center text-slate-400 py-12 flex flex-col items-center justify-center animate-enter">
                        <div class="bg-indigo-50 text-indigo-300 w-16 h-16 rounded-full flex items-center justify-center mb-4 text-2xl shadow-inner">
                            <i class="fas fa-clipboard-check"></i>
                        </div>
                        <p class="text-lg">You're all caught up!</p>
                        <p class="text-sm mt-1 opacity-70">Add a task above to get started.</p>
                    </li>
                `;
            } else if (filteredTodos.length === 0) {
                 todoList.innerHTML = `
                    <li class="text-center text-slate-400 py-10 animate-enter">
                        <p>No tasks found in this view.</p>
                    </li>
                `;
            }

            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `group flex flex-col p-4 bg-white rounded-2xl shadow-sm border border-slate-100 mb-3 transition-all duration-300 hover:shadow-md animate-enter ${todo.completed ? 'opacity-60 bg-slate-50' : ''}`;
                
                // Format Time Display
                let timeDisplay = '';
                if (todo.time) {
                    const [h, m] = todo.time.split(':');
                    const date = new Date();
                    date.setHours(h, m);
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const reminderIcon = todo.reminder >= 0 ? `<i class="fas fa-bell text-amber-500 ml-1.5" title="${todo.reminder === 0 ? 'At exact time' : todo.reminder + ' min reminder'}"></i>` : '';
                    
                    timeDisplay = `<span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md ml-2 font-semibold flex items-center border border-indigo-100">
                        <i class="far fa-clock mr-1"></i> ${timeStr} ${reminderIcon}
                    </span>`;
                }

                // Category Badge formatting
                let catColor = "bg-slate-100 text-slate-600";
                if(todo.category === 'Work') catColor = "bg-blue-100 text-blue-700";
                if(todo.category === 'Personal') catColor = "bg-pink-100 text-pink-700";
                if(todo.category === 'Health') catColor = "bg-emerald-100 text-emerald-700";

                li.innerHTML = `
                    <div class="flex items-center justify-between w-full">
                        <div class="flex items-center flex-1 cursor-pointer overflow-hidden" onclick="toggleTodoStatus('${todo.id}', ${todo.completed})">
                            <button class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 transition-all duration-300 ${todo.completed ? 'bg-indigo-500 border-indigo-500' : 'border-slate-300 group-hover:border-indigo-400'}">
                                ${todo.completed ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                            </button>
                            <div class="flex flex-col flex-1 truncate">
                                <span class="text-slate-700 truncate transition-all duration-300 ${todo.completed ? 'line-through text-slate-400' : 'font-medium text-[17px]'}">
                                    ${escapeHtml(todo.text)}
                                </span>
                                <div class="flex items-center mt-1.5">
                                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${catColor}">${todo.category || 'General'}</span>
                                    ${timeDisplay}
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteTodoItem('${todo.id}')" class="flex-shrink-0 ml-4 w-8 h-8 rounded-full text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all opacity-0 group-hover:opacity-100 focus:opacity-100">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>
                `;
                todoList.appendChild(li);
            });

            // Update stats
            const activeCount = todos.filter(t => !t.completed).length;
            itemsLeft.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
        }

        // --- Event Listeners ---

        addBtn.addEventListener('click', handleAddTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAddTodo();
        });

        clearCompletedBtn.addEventListener('click', handleClearCompleted);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove('text-indigo-600', 'bg-white', 'shadow-sm', 'font-medium');
                    b.classList.add('hover:text-slate-800');
                });
                const target = e.target;
                target.classList.remove('hover:text-slate-800');
                target.classList.add('text-indigo-600', 'bg-white', 'shadow-sm', 'font-medium');
                
                currentFilter = target.dataset.filter;
                renderTodos();
            });
        });

        catFilterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                catFilterBtns.forEach(b => {
                    b.classList.remove('bg-indigo-100', 'text-indigo-700', 'shadow-sm', 'border-transparent');
                    b.classList.add('bg-white', 'text-slate-500', 'border-slate-200');
                });
                const target = e.target;
                target.classList.remove('bg-white', 'text-slate-500', 'border-slate-200');
                target.classList.add('bg-indigo-100', 'text-indigo-700', 'shadow-sm', 'border-transparent');
                
                currentCategory = target.dataset.cat;
                renderTodos();
            });
        });

        // --- Settings Modal & Custom Audio Logic ---
        function toggleModal(show) {
            if (show) {
                settingsModal.classList.remove('hidden');
                setTimeout(() => {
                    settingsModal.classList.remove('opacity-0');
                    settingsModal.firstElementChild.classList.remove('scale-95');
                }, 10);
            } else {
                settingsModal.classList.add('opacity-0');
                settingsModal.firstElementChild.classList.add('scale-95');
                setTimeout(() => settingsModal.classList.add('hidden'), 300);
            }
        }

        settingsBtn.addEventListener('click', () => toggleModal(true));
        closeSettings.addEventListener('click', () => toggleModal(false));

        let customAudioData = localStorage.getItem('custom_alarm_audio');
        let alarmAudio = new Audio();
        let alarmTimeout = null;
        let isTesting = false;
        let activeOscillator = null;

        if (customAudioData) {
            alarmAudio.src = customAudioData;
            clearSoundBtn.classList.remove('hidden');
        }

        audioUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if(file.size > 2.5 * 1024 * 1024) {
                    showToast("File too large! Max 2.5MB allowed.");
                    audioUpload.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    customAudioData = event.target.result;
                    alarmAudio.src = customAudioData;
                    localStorage.setItem('custom_alarm_audio', customAudioData);
                    clearSoundBtn.classList.remove('hidden');
                    showToast("Custom sound loaded.");
                };
                reader.readAsDataURL(file);
            }
        });

        clearSoundBtn.addEventListener('click', () => {
            customAudioData = null;
            alarmAudio.removeAttribute('src');
            localStorage.removeItem('custom_alarm_audio');
            audioUpload.value = '';
            clearSoundBtn.classList.add('hidden');
            stopAlarmPlayback();
            showToast("Custom sound removed. Using default beep.");
        });

        saveSettingsBtn.addEventListener('click', saveSettings);

        testSoundBtn.addEventListener('click', () => {
            if (isTesting) {
                stopAlarmPlayback();
            } else {
                playAlarmPlayback();
                isTesting = true;
                testSoundBtn.innerHTML = '<i class="fas fa-stop mr-1 text-red-500"></i> Stop';
            }
        });

        // --- Alarm & Notification Logic ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playAlarmPlayback() {
            const duration = userSettings.duration || '5';
            const timeMs = duration === 'full' ? 300000 : parseInt(duration) * 1000;
            
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (customAudioData) {
                alarmAudio.currentTime = 0;
                alarmAudio.play().catch(e => console.log("Audio play blocked", e));
                
                if (duration !== 'full') {
                    alarmTimeout = setTimeout(() => stopAlarmPlayback(), timeMs);
                }
                
                alarmAudio.onended = () => { 
                    if(isTesting) stopAlarmPlayback(); 
                };
            } else {
                activeOscillator = audioCtx.createOscillator();
                const activeGain = audioCtx.createGain();
                
                activeOscillator.type = 'sine';
                activeOscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                
                activeGain.gain.setValueAtTime(0, audioCtx.currentTime);
                
                const beepCount = duration === 'full' ? 60 : Math.ceil(timeMs / 1000);
                for(let i = 0; i < beepCount; i++) {
                    activeGain.gain.setValueAtTime(0.3, audioCtx.currentTime + i);
                    activeGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i + 0.5);
                }
                
                activeOscillator.connect(activeGain);
                activeGain.connect(audioCtx.destination);
                
                activeOscillator.start();
                activeOscillator.stop(audioCtx.currentTime + beepCount);
                
                alarmTimeout = setTimeout(() => {
                    stopAlarmPlayback();
                }, timeMs);
            }
        }

        function stopAlarmPlayback() {
            if (alarmTimeout) clearTimeout(alarmTimeout);
            
            if (customAudioData) {
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
            }
            
            if (activeOscillator) {
                try { activeOscillator.stop(); } catch(e){}
                activeOscillator = null;
            }
            
            isTesting = false;
            testSoundBtn.innerHTML = '<i class="fas fa-play mr-1 text-indigo-500"></i> Test';
        }

        function triggerAlarm(todo) {
            playAlarmPlayback();
            showToast(`Reminder: "${todo.text}" is due!`);
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("To-Do Reminder", {
                    body: `${todo.text} (${todo.category})\n${todo.reminder === 0 ? 'Due now!' : 'Due in ' + todo.reminder + ' mins'}`,
                });
            }

            const index = todos.findIndex(t => t.id === todo.id);
            if(index !== -1) {
                todos[index].notified = true;
                saveTodos();
            }
        }

        setInterval(() => {
            if (todos.length === 0) return;
            
            const now = new Date();
            const currentTotalMinutes = (now.getHours() * 60) + now.getMinutes();

            todos.forEach(todo => {
                if (!todo.completed && todo.time && todo.reminder >= 0 && !todo.notified) {
                    const [tHours, tMinutes] = todo.time.split(':').map(Number);
                    const taskTotalMinutes = (tHours * 60) + tMinutes;
                    const triggerTotalMinutes = taskTotalMinutes - todo.reminder;
                    
                    if (currentTotalMinutes >= triggerTotalMinutes && currentTotalMinutes <= taskTotalMinutes + 5) {
                        triggerAlarm(todo);
                    }
                }
            });
        }, 10000);

        // Initialize App
        loadTodos();

    </script>
</body>
</html>
